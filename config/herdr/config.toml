onboarding = false

[terminal]
new_cwd = "follow"

[theme]
name = "tokyo-night"

# Sidebar inherits the theme background so it reads as one continuous surface;
# only the active-row and selection highlights are customized.
[theme.custom]
active_row_bg = "#292e42"
selection_bg = "#3b4261"

[ui]
prompt_new_tab_name = false
confirm_close = false

# I live in the collapsed sidebar: start there, and keep the narrow status rail
# (compact) rather than hiding it to zero width.
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"

# Surface the active workspace in the terminal/tab title -- useful when the
# sidebar is collapsed and the space name isn't otherwise visible.
window_title = "{workspace}"

# Reclaim the tab-bar row when a workspace only has one tab.
hide_tab_bar_when_single_tab = true

# Tokyo Night blue accent for highlights, borders and pickers (default: cyan).
accent = "#7aa2f7"

status_indicators = "dots"
# Attention queue: float blocked/working agents to the top of the panel (rather
# than grouping strictly by space) so the ones needing input surface first.
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

# Right side of the tab bar: ZOOM pill + date/clock (plain text, no per-cell color).
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%d-%m-%Y | %H:%M" },
]
tab_bar_right_separator = "  "

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#7aa2f7", bold = true }, { token = "git_status", dim = true }],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", bold = true }, { token = "terminal_title_stripped", dim = true }],
]

# Background agent state changes -> in-app Herdr toasts only (no OS notifications).
[ui.toast]
delivery = "herdr"

# Audible cue when a background agent goes blocked (needs input) or done.
# (droid stays muted by Herdr's default.)
[ui.sound]
enabled = true

# Reattach agent panes to their native conversation sessions after a Herdr
# server restart/reload (requires official integrations that report session refs).
[session]
resume_agents_on_restore = true

# [worktrees].directory is set from reposRoot in home/herdr.nix.

[keys]
prefix = "ctrl+a"

# Splits keep tmux muscle memory () and -); herdr defaults are prefix+v/minus.
split_vertical = "prefix+)"
split_horizontal = "prefix+minus"

# Pane focus is prefix-only. Direct ctrl+h/j/k/l are intentionally NOT bound:
# Herdr has no per-app key passthrough, so they'd be swallowed before reaching
# terminal apps and would shadow shell essentials everywhere (ctrl+j newline,
# ctrl+k kill-line, ctrl+l clear, ctrl+h backspace) -- notably breaking
# ctrl+j/ctrl+k selection in fzf. Navigate mode (prefix+w) still uses ctrl+j/k.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# h/j/k/l move panes here, so workspaces use fzf-style ctrl+k/ctrl+j (arrows still work).
navigate_workspace_up = ["up", "ctrl+k"]
navigate_workspace_down = ["down", "ctrl+j"]

# On AZERTY shift+& yields "1", so the default digit tab-switch would also grab
# shift+digits -- disable it; the unshifted number row drives tabs (commands below).
switch_tab = ""
switch_workspace = "prefix+shift+1..9"

# goto unbound: shift+1..9 + sidebar + popups already cover jumping around.
goto = ""

# prefix+b is the break-pane command below, so the sidebar moves to shift+b.
toggle_sidebar = "prefix+shift+b"

# Worktree lifecycle lives entirely in the prefix+space palette (herdr-go: N
# creates, D removes), so the native create binding is retired -- one way to do
# a thing. open/remove were already unset.
new_worktree = ""

# prefix+ctrl+a can't be used (double-tapping the prefix sends a literal ctrl+a
# to the app), so last-pane takes prefix+a. The agent-switch binds are retired
# to free it -- unused in this workflow -- and prefix+shift+a with them.
last_pane = "prefix+a"
next_agent = ""
previous_agent = ""

# The command palette: navigate every ~/dev repo and its worktrees, create new
# worktrees (N), and tear spaces down (D) -- all from one popup.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "$HOME/.nix-profile/bin/herdr-go"
description = "repos + worktrees: open · N new · D delete"
width = "42%"
height = "55%"

# Break pane to new tab (tmux: prefix b)
[[keys.command]]
key = "prefix+b"
type = "shell"
command = "herdr pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab"
description = "break pane to new tab"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "$HOME/.nix-profile/bin/lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# AZERTY number row -> tabs 1-10 (same physical keys as tmux)
[[keys.command]]
key = "prefix+ampersand"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 1"

[[keys.command]]
key = "prefix+é"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 2"

[[keys.command]]
key = "prefix+double_quote"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 3"

[[keys.command]]
key = "prefix+quote"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 4"

[[keys.command]]
key = "prefix+("
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 5"

[[keys.command]]
key = "prefix+§"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 6"

[[keys.command]]
key = "prefix+è"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 7"

[[keys.command]]
key = "prefix+!"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 8"

[[keys.command]]
key = "prefix+ç"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 9"

[[keys.command]]
key = "prefix+à"
type = "shell"
command = "$HOME/.nix-profile/bin/herdr-tab-focus 10"
